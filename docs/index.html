<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK · Lo nuevo</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   MK — catálogo + ficha interactiva
   Un solo archivo. Sin dependencias, sin build, sin servidor.
   ═══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }

:root{
  --tinta:      #111111;
  --tinta-2:    #4a4a4a;
  --gris:       #707072;
  --gris-claro: #cacacb;
  --linea:      #e5e5e5;
  --linea-2:    #f0f0f0;
  --nuevo:      #9e3500;
  --acento:     #111111;
  --fuente: "Helvetica Neue", Helvetica, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

html, body { margin:0; padding:0; }
body{
  background:#fff;
  color: var(--tinta);
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; cursor: pointer; }
img{ max-width:100%; display:block; }
.oculto{ display:none !important; }

/* ══ CABECERA ══════════════════════════════════════════════════════ */
.cabecera{
  display:flex; align-items:center; gap:26px;
  padding:22px 34px; border-bottom:1px solid #e8e8e8;
  position:sticky; top:0; background:#fff; z-index:30;
}
.marca{
  font-weight:700; font-size:19px; letter-spacing:.15em;
  color:#111; text-decoration:none; white-space:nowrap;
}
.buscador{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  border:1px solid #e0e0e0; border-radius:999px; padding:7px 15px;
  background:#fafafa; transition:border-color .16s, background .16s;
}
.buscador:focus-within{ border-color:#111; background:#fff; }
.buscador input{
  border:0; background:none; outline:none; font:inherit; font-size:14px;
  width:170px; color:#111;
}
.buscador input::placeholder{ color:#9a9a9a; }
.buscador svg{ width:15px; height:15px; flex:none; }

/* ── Introducción ── */
.catalogo{
  max-width:1340px; margin:0 auto; padding:34px 34px 90px;
  display:grid; grid-template-columns:214px minmax(0,1fr); gap:0 46px;
  align-items:start;
}
.intro h1{ font-size:31px; font-weight:700; letter-spacing:-.015em; margin:0 0 9px; }
.intro p{ color:#6d6d6d; font-size:14.5px; line-height:1.55; margin:0; max-width:64ch; }

/* ── Navegación por líneas, en la columna izquierda ──
   Antes eran tres paneles de filtros (género, categoría y etiqueta) que
   obligaban a combinar casillas para llegar a algo que aquí se elige de un
   toque. Y ahora va en una columna propia, así que no le roba alto a la
   rejilla. */
.lineas{ position:sticky; top:98px; padding-top:4px; }
.lineas-titulo{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:#9a9a9a; margin:0 0 14px;
}
.linea{
  display:flex; align-items:baseline; gap:8px; width:100%;
  font:inherit; font-size:14px; text-align:left; cursor:pointer;
  padding:9px 12px; margin-bottom:2px; border:0; border-radius:9px;
  background:none; color:#3a3a3a; transition:background .14s, color .14s;
}
.linea:hover{ background:#f4f4f4; color:#111; }
.linea[aria-pressed="true"]{ background:#111; color:#fff; font-weight:600; }
.linea .n{
  margin-left:auto; font-size:12px; opacity:.45;
  font-variant-numeric:tabular-nums;
}
.linea[aria-pressed="true"] .n{ opacity:.62; }

.resultados{ min-width:0; }

/* ── Resultados ── */
.cab-resultados{
  display:flex; align-items:baseline; gap:16px;
  margin-top:26px; padding-top:18px; border-top:1px solid #eee;
}
.cab-resultados p{ color:#6d6d6d; font-size:13.5px; margin:0; }
.herramientas{ margin-left:auto; }
.herramientas select{
  font:inherit; font-size:13.5px; padding:8px 12px; color:#3a3a3a;
  border:1px solid #e0e0e0; border-radius:9px; background:#fff; cursor:pointer;
}
.herramientas select:hover{ border-color:#111; }

/* ── Rejilla de producto ── */
.rejilla{
  display:grid; grid-template-columns:repeat(3, 1fr);
  gap:36px 28px; margin-top:24px;
}
.tarjeta{ display:flex; flex-direction:column; }
.tarjeta-foto{
  display:grid; place-items:center; padding:12px;
  aspect-ratio:4 / 3; background:#fff;
  border:1px solid #ececec; border-radius:13px; overflow:hidden;
  cursor:pointer; transition:border-color .16s, box-shadow .16s;
}
.tarjeta-foto:hover{ border-color:#111; box-shadow:0 3px 16px rgba(0,0,0,.06); }
.tarjeta-foto img{ width:100%; height:100%; object-fit:contain; display:block; }
.tarjeta-info{ padding:13px 2px 0; }
.insignia{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:#111;
  border:1px solid #111; border-radius:999px; padding:2px 9px; margin-bottom:8px;
}
.tarjeta-info h3{ font-size:14.5px; font-weight:700; margin:0 0 3px; color:#111; }
.tarjeta-info .cat{ font-size:12.5px; color:#6d6d6d; margin:0 0 9px; }
.tarjeta-info .precio{ font-size:15px; font-weight:700; margin:0; color:#111; }
.tarjeta-ver{
  margin-top:9px; font-size:12.5px; font-weight:600; color:#111;
  display:inline-flex; align-items:center; gap:6px;
}
.tarjeta-foto:hover + .tarjeta-info .tarjeta-ver{ text-decoration:underline; }
.sin-resultados{ padding:60px 0; color:#6d6d6d; font-size:14.5px; text-align:center; }

/* ══ DETALLE ═══════════════════════════════════════════════════════ */

.cab-detalle{
  display:flex; align-items:center; gap:18px;
  padding: 14px 44px;
  border-bottom:1px solid var(--linea);
  position: sticky; top:0; z-index:30; background:#fff;
}
.volver{
  background:none; border:0; padding:6px 0;
  font-size:14px; color:var(--tinta);
  display:flex; align-items:center; gap:7px;
}
.volver:hover{ color:var(--gris); }
.cab-detalle .marca{ font-size:19px; order:-1; }
.cab-detalle .volver{ margin-left:auto; }

.detalle{
  display:grid;
  grid-template-columns: minmax(0,1fr) 372px;
  gap:0;
  border-bottom:1px solid var(--linea);
}

/* ── Escenario ── */
.pista{
  position:absolute; left:0; right:0; bottom:0;
  padding: 26px 18px 11px; text-align:center; pointer-events:none;
  font-size:11.5px; color:var(--gris); letter-spacing:.02em;
  background: linear-gradient(transparent, rgba(255,255,255,.92) 62%);
  opacity:1; transition: opacity .25s;
}
.escenario.zoom .pista{ opacity:0; }
.escenario{
  position:relative;
  background:#fff;
  min-height: 420px;
  height: calc(100vh - 190px);
  max-height: 780px;
  overflow:hidden;
  cursor: grab;
  touch-action: none;
  border-right:1px solid var(--linea);
}
.escenario.arrastrando{ cursor: grabbing; }
.escenario.zoom{ cursor: crosshair; }

.lienzo{
  position:absolute; left:0; top:0;
  transform-origin: 0 0;
  will-change: transform;
}
/* Solo al centrar una pieza desde la lista. Con la rueda y el arrastre la
   respuesta tiene que ser inmediata, así que van sin transición. */
.lienzo.suave{ transition: transform .44s cubic-bezier(.32,.72,0,1); }
.lienzo img{ width:100%; height:100%; user-select:none; -webkit-user-drag:none; }

/* ── Salir y volver ──
   Bajar del todo, o arrastrar hacia abajo, cierra la ficha: es el gesto de
   siempre para salir de una foto a pantalla completa. */
#vistaDetalle{ transition: transform .3s cubic-bezier(.32,.72,0,1), opacity .3s; }
#vistaDetalle.saliendo{ transform: translateY(48px); opacity:0; }
#vistaCatalogo.entrando{ animation: entrar .4s cubic-bezier(.32,.72,0,1) both; }
@keyframes entrar{
  from{ opacity:0; transform: translateY(-16px); }
  to  { opacity:1; transform:none; }
}

/* ── Panel ── */
.ayuda{
  font-size:13px; line-height:1.55; color:#6d6d6d;
  background:#f7f7f7; border-radius:11px; padding:12px 15px; margin:18px 0 24px;
}
.panel{ padding: 26px 30px 40px; overflow-y:auto; max-height: calc(100vh - 190px); }
.panel h2{ font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
.panel .p-cat{ font-size:14px; color:var(--gris); margin:0 0 14px; }
.panel .p-precio{ font-size:19px; font-weight:600; margin:0 0 22px; }
.seccion{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gris); font-weight:700; margin: 0 0 10px;
  padding-top: 20px; border-top:1px solid var(--linea-2);
}
.pieza{
  display:flex; align-items:center; gap:11px; width:100%;
  background:none; border:0; border-radius:6px;
  padding: 8px 9px; margin-bottom:2px;
  font-size:14px; color:var(--tinta-2); text-align:left;
}
.pieza:hover{ background:#f7f7f7; color:var(--tinta); }
.pieza[aria-pressed="true"]{ background:#f0f0f0; color:var(--tinta); font-weight:600; }
.pieza .n{
  flex:0 0 21px; height:21px; border-radius:50%;
  background:#fff; border:1.5px solid var(--gris-claro);
  font-size:11px; font-weight:700; display:grid; place-items:center;
  color:var(--tinta-2);
}
.pieza[aria-pressed="true"] .n{ background:var(--tinta); border-color:var(--tinta); color:#fff; }

.ficha{ margin-top:20px; border-top:1px solid var(--linea); padding-top:20px; }
.ficha-muestra{
  height:104px; border-radius:8px; margin-bottom:16px;
  border:1px solid var(--linea);
  position:relative; overflow:hidden;
}
.ficha-muestra span{
  position:absolute; left:11px; bottom:9px;
  font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  font-weight:700; color:rgba(255,255,255,.9);
  text-shadow: 0 1px 5px rgba(0,0,0,.8);
}
.ficha h3{ font-size:16px; font-weight:600; margin:0 0 2px; }
.ficha .tipo{
  font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  font-weight:700; color:var(--nuevo); margin:0 0 11px;
}
.ficha p.desc{ font-size:13.5px; color:var(--tinta-2); margin:0 0 15px; line-height:1.6; }
.especificaciones{ font-size:13px; margin:0; }
.especificaciones > div{
  display:flex; justify-content:space-between; gap:14px;
  padding: 8px 0; border-top:1px solid var(--linea-2);
}
.especificaciones dt{ color:var(--gris); margin:0; }
.especificaciones dd{ margin:0; font-weight:600; text-align:right; }

.aviso{
  border:1px dashed var(--linea); border-radius:8px;
  padding: 26px 18px; text-align:center; color:var(--gris); font-size:13.5px;
  margin-top:20px;
}
.aviso b{ display:block; color:var(--tinta-2); margin-bottom:5px; font-size:14px; }

/* Texturas de muestra (CSS puro, sin imágenes) */
.tx-ante{
  background-color:#1c1a19;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.11) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(0,0,0,.5) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-piel{
  background-color:#17181a;
  background-image:
    radial-gradient(circle at 30% 35%, rgba(255,255,255,.09) 0 1px, transparent 1.7px),
    radial-gradient(circle at 72% 68%, rgba(0,0,0,.45) 0 1.3px, transparent 2px);
  background-size: 8px 8px, 12px 12px;
}
.tx-trenza{
  background-color:#2a2b2e;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.15) 0 3px, transparent 3px 6px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.15) 0 3px, transparent 3px 6px);
}
.tx-espuma{
  background-color:#f4f4f6;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 9px);
}
.tx-cuero{
  background-color:#6f4527;
  background-image:
    radial-gradient(circle at 40% 40%, rgba(255,255,255,.10) 0 1px, transparent 1.6px),
    radial-gradient(circle at 74% 66%, rgba(0,0,0,.28) 0 1.2px, transparent 1.9px);
  background-size: 9px 9px, 13px 13px;
}
.tx-cuero-negro{
  background-color:#1a1b1d;
  background-image:
    radial-gradient(circle at 38% 42%, rgba(255,255,255,.08) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 64%, rgba(0,0,0,.40) 0 1.2px, transparent 1.8px);
  background-size: 9px 9px, 13px 13px;
}
.tx-goma{
  background-color:#131315;
  background-image:
    repeating-linear-gradient(62deg, rgba(255,255,255,.10) 0 2px, transparent 2px 8px);
}
.tx-metal{
  background: linear-gradient(140deg,#8e9196,#d6d9dd 42%,#7d8085);
}
.tx-tpu{
  background: linear-gradient(140deg,#0d0e10,#3a3d42 48%,#0a0b0d);
}

/* Antes teñidos en pieza: el color va en la muestra, la trama es la misma */
.tx-ante-verde{
  background-color:#1f3a2c;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.10) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(0,0,0,.45) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-ante-camel{
  background-color:#c9ab86;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.30) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(90,60,30,.32) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-ante-teja{
  background-color:#8a3b22;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.16) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(0,0,0,.40) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-piel-naranja{
  background-color:#d08a30;
  background-image:
    radial-gradient(circle at 30% 35%, rgba(255,255,255,.20) 0 1px, transparent 1.7px),
    radial-gradient(circle at 72% 68%, rgba(90,50,0,.35) 0 1.3px, transparent 2px);
  background-size: 9px 9px, 13px 13px;
}
.tx-goma-miel{
  background-color:#b98d5c;
  background-image:
    repeating-linear-gradient(62deg, rgba(255,255,255,.14) 0 2px, transparent 2px 8px);
}
.tx-malla{
  background-color:#2a2f42;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.22) 0 1.3px, transparent 1.8px);
  background-size: 6px 6px;
}
.tx-tela{
  background-color:#2c2f38;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px);
}
.tx-ante-rojo{
  background-color:#8e1a26;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.14) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(0,0,0,.42) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-ante-plomo{
  background-color:#5a5a60;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.20) 0 1.4px, transparent 2.2px),
    radial-gradient(circle at 22% 78%, rgba(0,0,0,.34) 0 1.8px, transparent 2.8px);
  background-size: 6px 6px, 10px 10px;
}
.tx-piel-negra{
  background-color:#1a1b1e;
  background-image:
    radial-gradient(circle at 30% 35%, rgba(255,255,255,.10) 0 1px, transparent 1.7px),
    radial-gradient(circle at 72% 68%, rgba(0,0,0,.45) 0 1.3px, transparent 2px);
  background-size: 8px 8px, 12px 12px;
}

/* ══ RESPONSIVE ════════════════════════════════════════════════════ */

@media (max-width: 1080px){
  .catalogo{ padding: 30px 28px 80px; grid-template-columns:186px minmax(0,1fr); gap:0 30px; }
  .cabecera, .cab-detalle{ padding-left:28px; padding-right:28px; }
  .rejilla{ grid-template-columns: repeat(2, 1fr); }
  .detalle{ grid-template-columns: minmax(0,1fr) 320px; }
}

@media (max-width: 860px){
  /* En móvil la columna de líneas pasa a ser una fila horizontal arriba */
  .catalogo{ padding: 22px 18px 60px; grid-template-columns:1fr; gap:0; }
  .lineas{
    position:static; display:flex; gap:8px; overflow-x:auto;
    padding:0 0 6px; margin-bottom:22px; -webkit-overflow-scrolling:touch;
  }
  .lineas-titulo{ display:none; }
  .linea{
    width:auto; white-space:nowrap; margin:0;
    border:1px solid #e0e0e0; border-radius:999px; padding:8px 15px;
  }
  .linea[aria-pressed="true"]{ border-color:#111; }
  .linea .n{ margin-left:6px; }
  .cabecera{ padding: 14px 18px; }
  .cab-detalle{ padding: 12px 18px; }
  .intro h1{ font-size:25px; }
  .intro p{ font-size:14px; }
  .buscador input{ width:120px; }
  .rejilla{ grid-template-columns: repeat(2, 1fr); gap: 26px 14px; }
  .detalle{ grid-template-columns: 1fr; }
  .escenario{
    height: 62vw; min-height:250px; max-height:420px;
    border-right:0; border-bottom:1px solid var(--linea);
  }
  .panel{ max-height:none; padding: 22px 18px 34px; }
  .cab-resultados{ flex-wrap:wrap; row-gap:10px; }
}

@media (max-width: 520px){
  .buscador{ display:none; }
  .rejilla{ gap: 24px 12px; }
  .intro h1{ font-size:22px; }
}

</style>
</head>
<body>

<!-- ══════════════════ VISTA 1 · CATÁLOGO ══════════════════ -->
<div id="vistaCatalogo">

  <header class="cabecera">
    <a class="marca" href="#" id="irInicio" aria-label="Ver todo el calzado">MK</a>
    <div class="buscador">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="buscador" type="search" placeholder="Buscar un modelo"
             aria-label="Buscar un modelo por nombre">
    </div>
  </header>

  <main class="catalogo">
    <aside class="lineas" id="chips" aria-label="Líneas de calzado"></aside>

    <section class="resultados">
    <div class="intro">
      <h1 id="introTitulo">Todo el calzado</h1>
      <p id="introTexto"></p>
    </div>

    <div class="cab-resultados">
      <p id="nResultados"></p>
      <div class="herramientas">
        <select id="orden" aria-label="Ordenar los modelos">
          <option value="orden">Orden del catálogo</option>
          <option value="precio-asc">Precio: de menor a mayor</option>
          <option value="precio-desc">Precio: de mayor a menor</option>
          <option value="nombre">Nombre, de la A a la Z</option>
        </select>
      </div>
    </div>

    <div class="rejilla" id="rejilla"></div>
    <div class="sin-resultados oculto" id="sinResultados"></div>
    </section>
  </main>
</div>

<!-- ══════════════════ VISTA 2 · DETALLE ══════════════════ -->
<div id="vistaDetalle" class="oculto">

  <header class="cab-detalle">
    <button class="volver" id="volver">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/></svg>
      Volver
    </button>
    <span class="marca">M K</span>
  </header>

  <div class="detalle">
    <div class="escenario" id="escenario">
      <div class="lienzo" id="lienzo">
        <img id="foto" alt="" draggable="false">
      </div>
      <p class="pista">Rueda o pellizco para acercar · arrastra para mover · baja para volver</p>
    </div>

    <aside class="panel">
      <h2 id="pNombre">—</h2>
      <p class="p-cat" id="pCategoria">—</p>
      <p class="p-precio" id="pPrecio">—</p>
      <p class="ayuda">Toca un nombre de la lista para ver de qué material es
        cada parte. La foto se acerca con la rueda o pellizcando, y se mueve
        arrastrando.</p>
      <p class="seccion">Las piezas, una a una</p>
      <div id="pLista"></div>
      <div id="pFicha"></div>
    </aside>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════
   1 · DATOS
   Cada producto es autocontenido: imagen, tamaño natural y sus piezas
   con la posición del hotspot en coordenadas de la imagen.
   ═══════════════════════════════════════════════════════════════════ */

const PRODUCTOS = [
  {
    id: "zapatillas-001",
    nombre: "MK Terra High",
    categoria: "Zapatillas para hombre",
    genero: "Hombre",
    tipo: "Caña alta urbana",
    precio: 429.90,
    colores: 1,

/* Facetas del filtro, derivadas de los productos */
/* Las líneas del catálogo, en el orden en que se muestran.
   Se sacan de los propios datos, así que añadir un modelo nuevo con un tipo
   nuevo hace aparecer su pestaña sola. */
const LINEAS = ["Caña alta urbana", "Caña baja urbana", "Caña baja clásica",
                "Vestir", "Botas"];

/* ═══════════════════════════════════════════════════════════════════
   2 · ESTADO
   ═══════════════════════════════════════════════════════════════════ */

const $ = (s) => document.querySelector(s);

const E = {
  linea: "todo",          // línea activa, o "todo" para verlas todas
  orden: "orden",
  busqueda: "",
  producto: null
};

/* Qué es cada línea, dicho para quien no conoce el producto.
   "Caña" es la altura del zapato por encima del tobillo: es el término
   correcto, pero no lo sabe todo el mundo, así que se explica. */
const QUE_ES = {
  "Caña alta urbana": "Suben por encima del tobillo, con suela gruesa y aire deportivo.",
  "Caña baja urbana": "Bajos, montados sobre una suela alta y gruesa.",
  "Caña baja clásica": "Bajos, de líneas finas y suela de goma. Los de siempre.",
  "Vestir": "Piel lisa y suela de goma dentada. Para looks formales.",
  "Botas": "Caña alta de invierno, con suela de tacos y piel tratada."
};

function resumenTodo(){
  return PRODUCTOS.length + " modelos en " + LINEAS.length +
         " líneas. Toca cualquiera para ver de cerca de qué está hecho.";
}

/* ═══════════════════════════════════════════════════════════════════
   3 · CATÁLOGO
   ═══════════════════════════════════════════════════════════════════ */

const eur = (n) => "S/ " + n.toFixed(2);

function valoresDe(p, campo){
  const v = p[campo];
  return Array.isArray(v) ? v : [v];
}

function productosFiltrados(){
  let lista = PRODUCTOS.filter(p => {
    if (E.linea !== "todo" && p.tipo !== E.linea) return false;
    if (E.busqueda){
      const t = (p.nombre + " " + p.categoria + " " + p.tipo).toLowerCase();
      if (!t.includes(E.busqueda)) return false;
    }
    return true;
  });
  if (E.orden === "precio-asc")  lista = lista.slice().sort((a,b) => a.precio - b.precio);
  if (E.orden === "precio-desc") lista = lista.slice().sort((a,b) => b.precio - a.precio);
  if (E.orden === "nombre")      lista = lista.slice().sort((a,b) => a.nombre.localeCompare(b.nombre,"es"));
  return lista;
}

function cuantosEn(linea){
  return PRODUCTOS.filter(p => linea === "todo" || p.tipo === linea).length;
}

/* Las líneas, como pastillas. Antes eran tres paneles de casillas (género,
   categoría y etiqueta) que obligaban a combinar filtros para llegar a algo
   que aquí se elige de un toque. */
function pintarChips(){
  const items = [["todo", "Todo el calzado"]].concat(LINEAS.map(l => [l, l]));
  $("#chips").innerHTML = '<p class="lineas-titulo">Líneas</p>' +
    items.map(([v, et]) => `
      <button class="linea" data-linea="${v}" aria-pressed="${E.linea === v}">
        ${et}<span class="n">${cuantosEn(v)}</span>
      </button>`).join("");
}

function pintarRejilla(){
  const lista = productosFiltrados();

  $("#introTitulo").textContent = E.linea === "todo" ? "Todo el calzado" : E.linea;
  $("#introTexto").textContent = E.busqueda
    ? (lista.length === 1 ? "1 resultado para tu búsqueda." : lista.length + " resultados para tu búsqueda.")
    : (E.linea === "todo" ? resumenTodo() : (QUE_ES[E.linea] || ""));

  $("#nResultados").textContent = lista.length === 1 ? "1 modelo" : lista.length + " modelos";
  $("#sinResultados").classList.toggle("oculto", lista.length > 0);
  $("#sinResultados").textContent =
    "No hay modelos que coincidan. Prueba con otra línea o borra la búsqueda.";

  $("#rejilla").innerHTML = lista.map(p => `
    <article class="tarjeta">
      <div class="tarjeta-foto" data-abrir="${p.id}" role="button" tabindex="0"
           aria-label="Ver las piezas de ${p.nombre}">
        <img src="${p.img}" alt="${p.nombre}" loading="lazy">
      </div>
      <div class="tarjeta-info">
        ${p.nuevo ? '<span class="insignia">Nuevo</span>' : ""}
        <h3>${p.nombre}</h3>
        <p class="cat">${p.tipo}</p>
        <p class="precio">${eur(p.precio)}</p>
        <span class="tarjeta-ver">Ver las piezas →</span>
      </div>
    </article>`).join("");
}

/* ═══════════════════════════════════════════════════════════════════
   4 · DETALLE · zoom, paneo y lupa sobre la fotografía
   ═══════════════════════════════════════════════════════════════════ */

const escenario = $("#escenario");
const lienzo    = $("#lienzo");
const foto      = $("#foto");
const K_MIN = 1, K_MAX = 5;

const Z = { k:1, tx:0, ty:0, ancho:0, alto:0, arrastrando:false, sel:null };
let arrastroReciente = false;
let bajo = 0;   // arrastre acumulado hacia abajo, para salir
let ultimo = null;

/* Ajusta el lienzo para que la imagen encaje entera en el escenario */
function ajustarLienzo(){
  const r = escenario.getBoundingClientRect();
  if (!(r.width > 0) || !Z.producto) return null;
  const base = Math.min(r.width / Z.producto.w, r.height / Z.producto.h);
  Z.ancho = Z.producto.w * base;
  Z.alto  = Z.producto.h * base;
  lienzo.style.width  = Z.ancho + "px";
  lienzo.style.height = Z.alto  + "px";
  return r;
}

function limitar(){
  const r = escenario.getBoundingClientRect();
  const aw = Z.ancho * Z.k, ah = Z.alto * Z.k;
  Z.tx = (aw <= r.width)  ? (r.width  - aw) / 2 : Math.min(0, Math.max(r.width  - aw, Z.tx));
  Z.ty = (ah <= r.height) ? (r.height - ah) / 2 : Math.min(0, Math.max(r.height - ah, Z.ty));
}

function aplicar(){
  limitar();
  lienzo.style.transform = `translate(${Z.tx}px, ${Z.ty}px) scale(${Z.k})`;
  escenario.classList.toggle("zoom", Z.k > 1.02);
}

function zoomEn(factor, px, py){
  const k2 = Math.min(K_MAX, Math.max(K_MIN, Z.k * factor));
  if (Math.abs(k2 - Z.k) < 1e-4) return;
  // La imagen bajo el cursor debe quedarse quieta
  const ux = (px - Z.tx) / Z.k, uy = (py - Z.ty) / Z.k;
  Z.tx = px - ux * k2;
  Z.ty = py - uy * k2;
  Z.k  = k2;
  aplicar();
}

/* Cursor -> coordenadas relativas al escenario */
function relativo(e){
  const r = escenario.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ── Piezas ── */
function pintarLista(){
  $("#pLista").innerHTML = Z.producto.piezas.map(q => `
    <button class="pieza" data-pieza="${q.id}" aria-pressed="false">
      <span class="n">${q.n}</span>${q.label}
    </button>`).join("");
}

function seleccionar(id){
  Z.sel = id;
  document.querySelectorAll(".pieza").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.pieza === id);
  });
  pintarFicha();
}

function pintarFicha(){
  const cont = $("#pFicha");
  if (!Z.sel){
    cont.innerHTML = `<div class="aviso">
      <b>Ninguna pieza seleccionada</b>
      Pulsa un punto sobre el calzado, o una pieza de la lista, para ver
      su material y sus especificaciones.</div>`;
    return;
  }
  const q = Z.producto.piezas.find(x => x.id === Z.sel);
  cont.innerHTML = `
    <div class="ficha">
      <div class="ficha-muestra ${q.tex}"><span>Muestra · ${q.label}</span></div>
      <h3>${q.material}</h3>
      <p class="tipo">${q.tipo}</p>
      <p class="desc">${q.desc}</p>
      <dl class="especificaciones">
        ${q.specs.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}
      </dl>
    </div>`;
}

/* Centra la vista sobre una pieza */
function enfocar(id){
  const q = Z.producto.piezas.find(x => x.id === id);
  if (!q) return;
  const r = escenario.getBoundingClientRect();
  const k2 = 2.6;
  const ux = q.x / Z.producto.w * Z.ancho;
  const uy = q.y / Z.producto.h * Z.alto;
  // Nunca acercar más allá de lo que la imagen permite
  Z.k = Math.min(k2, K_MAX);
  Z.tx = r.width  / 2 - ux * Z.k;
  Z.ty = r.height / 2 - uy * Z.k;
  // Deslizamiento suave; se quita al terminar para no arrastrar el retardo
  // en los movimientos con la rueda.
  lienzo.classList.add("suave");
  clearTimeout(enfocar._t);
  enfocar._t = setTimeout(() => lienzo.classList.remove("suave"), 470);
  aplicar();
}

function abrirDetalle(id, silencioso){
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  if (!silencioso) location.hash = "#/" + id;
  Z.producto = p; Z.sel = null; Z.k = 1; Z.tx = 0; Z.ty = 0;

  foto.src = p.img;
  foto.alt = p.nombre;
  $("#pNombre").textContent = p.nombre;
  $("#pCategoria").textContent = p.categoria;
  $("#pPrecio").textContent = eur(p.precio);

  pintarLista();
  $("#vistaCatalogo").classList.add("oculto");
  $("#vistaDetalle").classList.remove("oculto");
  window.scrollTo(0,0);

  // Esperar a que la imagen tenga tamaño para calcular el lienzo
  const listo = () => { ajustarLienzo(); pintarFicha(); aplicar(); };
  if (foto.complete) requestAnimationFrame(listo);
  else foto.addEventListener("load", () => requestAnimationFrame(listo), { once:true });
}

/* Cierra la ficha bajando la vista y devuelve el catálogo con una entrada
   suave, en vez de un cambio seco. */
let saliendo = false;
function salirConAnimacion(){
  if (saliendo || $("#vistaDetalle").classList.contains("oculto")) return;
  saliendo = true;
  const d = $("#vistaDetalle"), c = $("#vistaCatalogo");
  d.classList.add("saliendo");
  setTimeout(() => {
    d.classList.remove("saliendo");
    saliendo = false;
    cerrarDetalle();
    c.classList.add("entrando");
    setTimeout(() => c.classList.remove("entrando"), 420);
  }, 300);
}

function cerrarDetalle(silencioso){
  if (!silencioso) history.replaceState(null, "", location.pathname + location.search);
  $("#vistaDetalle").classList.add("oculto");
  $("#vistaCatalogo").classList.remove("oculto");
  Z.sel = null;
}

/* Enlace profundo: #/id-producto abre directamente su ficha */
function sincronizarHash(){
  const m = location.hash.match(/^#\/(.+)$/);
  const abierto = !$("#vistaDetalle").classList.contains("oculto");
  if (m && (!abierto || !Z.producto || Z.producto.id !== m[1])) abrirDetalle(m[1], true);
  else if (!m && abierto) cerrarDetalle(true);
}

/* ═══════════════════════════════════════════════════════════════════
   5 · EVENTOS
   ═══════════════════════════════════════════════════════════════════ */

/* Pastillas de línea, y abrir la ficha de un modelo */
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".linea");
  if (chip){
    E.linea = chip.dataset.linea;
    pintarChips();
    pintarRejilla();
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  const abrir = e.target.closest("[data-abrir]");
  if (abrir){ abrirDetalle(abrir.dataset.abrir); return; }
});

/* Abrir una tarjeta con el teclado */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const abrir = e.target.closest("[data-abrir]");
  if (abrir){ e.preventDefault(); abrirDetalle(abrir.dataset.abrir); }
});

$("#irInicio").addEventListener("click", (e) => {
  e.preventDefault();
  E.linea = "todo"; E.busqueda = ""; $("#buscador").value = "";
  pintarChips(); pintarRejilla();
});

$("#orden").addEventListener("change", (e) => { E.orden = e.target.value; pintarRejilla(); });
$("#buscador").addEventListener("input", (e) => {
  E.busqueda = e.target.value.trim().toLowerCase();
  pintarRejilla();
});

/* Volver */
$("#volver").addEventListener("click", () => cerrarDetalle());
window.addEventListener("hashchange", sincronizarHash);

/* Selección de pieza */
$("#pLista").addEventListener("click", (e) => {
  const b = e.target.closest(".pieza"); if (!b) return;
  const id = b.dataset.pieza;
  seleccionar(id === Z.sel ? null : id);
  if (Z.sel) enfocar(Z.sel);
});

/* Rueda = zoom hacia el cursor */
escenario.addEventListener("wheel", (e) => {
  e.preventDefault();
  // A aumento base, bajar es salir. Si ya está acercado, primero aleja.
  if (e.deltaY > 0 && Z.k <= K_MIN + 0.01){ salirConAnimacion(); return; }
  const p = relativo(e);
  zoomEn(e.deltaY < 0 ? 1.15 : 1/1.15, p.x, p.y);
}, { passive:false });

/* Arrastrar = desplazar */
escenario.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  Z.arrastrando = true;
  arrastroReciente = false;
  bajo = 0;
  ultimo = { x:e.clientX, y:e.clientY, tx:Z.tx, ty:Z.ty };
  escenario.classList.add("arrastrando");
  escenario.setPointerCapture(e.pointerId);
});

escenario.addEventListener("pointermove", (e) => {
  const r = escenario.getBoundingClientRect();

  if (Z.arrastrando && ultimo){
    const dx = e.clientX - ultimo.x, dy = e.clientY - ultimo.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) arrastroReciente = true;
    // A aumento base el lienzo no tiene por dónde moverse: el gesto hacia
    // abajo se interpreta como salir.
    if (Z.k <= K_MIN + 0.01 && dy > 0) bajo = Math.max(bajo, dy);
    Z.tx = ultimo.tx + dx;
    Z.ty = ultimo.ty + dy;
    aplicar();
  }
});

function soltar(e){
  if (!Z.arrastrando) return;
  if (bajo > 90){ Z.arrastrando = false; ultimo = null; bajo = 0;
    escenario.classList.remove("arrastrando"); salirConAnimacion(); return; }
  Z.arrastrando = false; ultimo = null;
  escenario.classList.remove("arrastrando");
  try { escenario.releasePointerCapture(e.pointerId); } catch(_){}
  setTimeout(() => { arrastroReciente = false; }, 60);
}
escenario.addEventListener("pointerup", soltar);
escenario.addEventListener("pointercancel", soltar);
escenario.addEventListener("dblclick", () => reiniciarZoom());

/* Botones */
function reiniciarZoom(){ Z.k = 1; Z.tx = 0; Z.ty = 0; ajustarLienzo(); aplicar(); }
/* Teclado */
document.addEventListener("keydown", (e) => {
  if ($("#vistaDetalle").classList.contains("oculto")) return;
  if (e.target.matches("input, select, textarea")) return;
  const k = e.key.toLowerCase();
  if (k === "escape"){ cerrarDetalle(); return; }
  if (k === "0"){ seleccionar(null); reiniciarZoom(); return; }
  const n = parseInt(k, 10);
  if (n >= 1 && n <= 9){
    const q = Z.producto.piezas.find(x => x.n === n);
    if (q){ seleccionar(q.id); enfocar(q.id); }
  }
});

/* Al cambiar el tamaño hay que recalcular el lienzo */
let temporizador;
window.addEventListener("resize", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    if ($("#vistaDetalle").classList.contains("oculto")) return;
    ajustarLienzo();
    aplicar();
  }, 140);
});
